name: 不具合の報告
description: 動かない・表示がおかしい・書き出した結果が変、などの報告
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        分かる範囲で構いません。空欄があっても報告してください。

  - type: textarea
    id: what
    attributes:
      label: 何が起きましたか
      description: 期待していた動きと、実際に起きたことを書いてください。
      placeholder: |
        図を PDF で保存したら、日本語の部分だけ文字が消えていた。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 再現する手順
      placeholder: |
        1. 下の Markdown を開く
        2. 図にカーソルを重ねて PDF を押す
        3. 保存した PDF を開く
    validations:
      required: true

  - type: textarea
    id: source
    attributes:
      label: 元になった Markdown
      description: |
        問題が起きる最小限の部分を貼ってください。ここは自動でコードブロックになります。
        **公開したくない内容は貼らないでください。** 同じ症状が出る別の例に置き換えて構いません。
      render: markdown

  - type: dropdown
    id: edition
    attributes:
      label: どちらで起きましたか
      options:
        - デスクトップ版（macOS アプリ）
        - ブラウザ版（PWA）
        - 両方
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: mdview の版
      description: デスクトップ版はメニューの「mdview について」で分かります。
      placeholder: 1.1.3

  - type: input
    id: env
    attributes:
      label: 環境
      description: macOS の版と Mac の種類（アップルメニュー →「このMacについて」）。ブラウザ版ならブラウザ名と版。
      placeholder: macOS 15.3 / Apple M2 / Chrome 140

  - type: textarea
    id: extra
    attributes:
      label: そのほか
      description: 画面の写真や、書き出したファイルがあれば添えてください。
